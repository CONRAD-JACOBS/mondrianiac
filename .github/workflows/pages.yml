name: Publish public and development sites
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          path: public-source
      - uses: actions/checkout@v6
        with:
          ref: dev
          path: dev-source
      - name: Assemble both sites
        run: python3 public-source/scripts/build_pages.py public-source dev-source _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      # Two branches can share a commit while their combined build changes.
      # Give every deployment a unique version instead of reusing that commit.
      - uses: actions/github-script@v8
        id: deployment
        with:
          script: |
            const { createHash } = require('node:crypto');
            const version = createHash('sha1')
              .update(`${context.sha}:${context.runId}:${process.env.GITHUB_RUN_ATTEMPT}`)
              .digest('hex');
            const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
              ...context.repo, run_id: context.runId
            });
            const artifact = artifacts.find(a => a.name === 'github-pages');
            if (!artifact) throw new Error('Pages artifact is missing');
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: artifact.id,
              pages_build_version: version,
              oidc_token: await core.getIDToken()
            });
            core.setOutput('page_url', deployment.page_url);
            for (let attempt = 0; attempt < 120; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', {
                ...context.repo, pages_deployment_id: deployment.id
              });
              core.info(`Deployment status: ${data.status}`);
              if (data.status === 'succeed') return;
              if (['deployment_failed', 'deployment_content_failed', 'deployment_cancelled',
                   'deployment_perms_error', 'deployment_lost'].includes(data.status)) {
                throw new Error(`Pages deployment failed: ${data.status}`);
              }
            }
            throw new Error('Pages deployment timed out');
